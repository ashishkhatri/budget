# Publishes a GitHub release whenever the version in budget/__init__.py changes on main.
# The release notes are that version's section of CHANGELOG.md.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(python3 -c 'import re;print(re.search(r"__version__ = \"(.+?)\"", open("budget/__init__.py").read()).group(1))')" >> "$GITHUB_OUTPUT"

      - name: Publish release if it doesn't exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released"; exit 0
          fi
          # notes = the "## vX.Y.Z" section of CHANGELOG.md, up to the next "## "
          awk -v tag="$TAG" '
            $0 ~ "^## " { if (found) exit; if (index($0, "## " tag) == 1) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
